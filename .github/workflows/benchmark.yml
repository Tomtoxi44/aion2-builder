name: Joueurs de comparaison

# Chaque jeudi (après la maintenance du mercredi) : refait les joueurs de comparaison de chaque classe (benchmark.json)
# d'après le site officiel, l'enregistre sur main et relance Build, qui publie la version du Builder qui les embarque
# (un push fait par un workflow ne déclenche pas les autres). Le fichier ne garde ni nom ni serveur.
on:
  schedule:
    - cron: '41 3 * * 4'
  workflow_dispatch:
    inputs:
      publish:
        description: Enregistrer sur main et publier (sinon, relevé seul, gardé en artefact)
        type: boolean
        default: true
      items_only:
        description: Relevé court des pièces seulement (data/gear-items.json, pour la liste des prix d'Aion 2 Todo), sans toucher aux joueurs de comparaison
        type: boolean
        default: false
      count:
        description: Joueurs lus par classe pour le relevé court
        default: '6'

permissions:
  contents: write # enregistrer benchmark.json
  actions: write # relancer Build

concurrency:
  group: benchmark

jobs:
  bench:
    runs-on: ubuntu-latest
    # ~24 min par classe : échantillon de 48 joueurs (~10 min, un import à la fois, pauses gardées), puis la puissance de
    # chaque joueur trouvé pour le top (~13 min) ; ~3 h 15 en tout (2 h 30 avec 24 joueurs). GitHub coupe un job à 6 h.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Relevé
        if: ${{ !inputs.items_only }}
        run: dotnet run --project src/Aion2Builder.Cli -c Release -- bench --out src/Aion2Builder.Core/GameData/Defaults/benchmark.json --items data/gear-items.json

      # Relevé court (lancement manuel) : quelques joueurs par classe, sans le top ; n'ajoute que des pièces à data/gear-items.json.
      - name: Relevé court des pièces
        if: ${{ inputs.items_only }}
        run: dotnet run --project src/Aion2Builder.Cli -c Release -- bench --items-only --items data/gear-items.json --count "${{ inputs.count }}"

      - name: Pièces enregistrées
        if: ${{ inputs.items_only && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/gear-items.json
          if git diff --cached --quiet; then echo "Rien de changé."; exit 0; fi
          git commit -m "Pièces relevées le $(date -u +%d/%m/%Y) (relevé court) [skip ci]"
          git pull --rebase
          git push

      - name: Fichiers relevés
        if: ${{ !inputs.items_only }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            src/Aion2Builder.Core/GameData/Defaults/benchmark.json
            src/Aion2Builder.Core/GameData/Defaults/gear-options.json
            data/gear-items.json
          retention-days: 7

      - name: Enregistrement et publication
        if: github.ref == 'refs/heads/main' && !inputs.items_only && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Aion2Builder.Core/GameData/Defaults/benchmark.json src/Aion2Builder.Core/GameData/Defaults/gear-options.json data/gear-items.json 2>/dev/null || git add -- src/Aion2Builder.Core/GameData/Defaults/benchmark.json
          if git diff --cached --quiet; then echo "Rien de changé."; exit 0; fi
          git commit -m "Joueurs de comparaison relevés le $(date -u +%d/%m/%Y)"
          git pull --rebase
          git push
          gh workflow run build.yml --ref main
